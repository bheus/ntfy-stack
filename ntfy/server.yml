# ntfy server config
# Reference: https://docs.ntfy.sh/config/

base-url: "https://ntfy.builtbybrendan.com"
listen-http: ":80"

# Auth — deny by default; admin user created via `ntfy user add` after first start.
auth-file: "/var/cache/ntfy/user.db"
auth-default-access: "deny-all"

# Cache (message history, served to subscribers reconnecting)
cache-file: "/var/cache/ntfy/cache.db"
cache-duration: "12h"

# Attachments (images/files in notifications)
attachment-cache-dir: "/var/cache/ntfy/attachments"
attachment-total-size-limit: "1G"
attachment-file-size-limit: "15M"
attachment-expiry-duration: "3h"

# Behind Cloudflare Tunnel — trust X-Forwarded-For for rate limiting.
# Safe because the host port is bound to 127.0.0.1 in docker-compose.yml,
# so only cloudflared (which sets X-Forwarded-For) can reach this.
behind-proxy: true

# Rate limits — tightened for internet exposure. Defaults are permissive.
visitor-request-limit-burst: 30
visitor-request-limit-replenish: "10s"
visitor-auth-failure-limit-burst: 10
visitor-auth-failure-limit-replenish: "1m"

# Web UI enabled (login required because auth-default-access: deny-all)
web-root: "app"

# Logging
log-level: "INFO"
log-format: "text"
